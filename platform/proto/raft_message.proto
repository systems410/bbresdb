syntax = "proto3";

package resdb;

// A single entry in the Raft log.
message RaftLogEntry {
  uint64 term = 1;
  uint64 seq = 2;
  bytes data = 3;         // serialized BatchUserRequest
  bytes hash = 4;
  int64 proxy_id = 5;
}

// AppendEntries RPC — sent by leader as both normal replication and heartbeat.
// Serialized into Request.data for TYPE_RAFT_APPEND_ENTRIES messages.
message RaftAppendEntries {
  uint64 term = 1;
  int32 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated RaftLogEntry entries = 5;
  uint64 leader_commit = 6;
}

// Response to AppendEntries.
// Serialized into Request.data for TYPE_RAFT_APPEND_ENTRIES_RESPONSE messages.
message RaftAppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;  // highest index known to be replicated on this follower
  int32 sender_id = 4;
}

// RequestVote RPC — sent by candidates during leader election.
// Serialized into Request.data for TYPE_RAFT_VOTE_REQUEST messages.
message RaftVoteRequest {
  uint64 term = 1;
  int32 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

// Response to RequestVote.
// Serialized into Request.data for TYPE_RAFT_VOTE_RESPONSE messages.
message RaftVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}
